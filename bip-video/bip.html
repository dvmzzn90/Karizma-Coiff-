<!doctype html>

<head>

<style>
  @font-face { font-family: "Baloo 2"; font-weight: 800; src: url(assets/baloo2-800.woff2) format("woff2"); }

  body.render svg#stage { width: 1080px; height: 1920px; }
  #ui { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
        font: 600 14px system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 999px; }
  #ui button { font: inherit; border: 0; border-radius: 999px; padding: 6px 14px; background: #ff8a2a; color: #fff; cursor: pointer; }
  #ui input { width: 220px; }
  body.render #ui { display: none; }
  text { font-family: "Baloo 2", "Inter", sans-serif; font-weight: 800; }
</style>
</head>
<body>
<div id="wrap">
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gSilver" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#e3e8ee"/>
      <stop offset="0.75" stop-color="#a7b1bd"/><stop offset="1" stop-color="#6b7581"/>
    </radialGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffab4a"/><stop offset="0.6" stop-color="#f27a1a"/><stop offset="1" stop-color="#b8510c"/>
    </linearGradient>
    <radialGradient id="gOrangeBall" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffd08a"/><stop offset="0.5" stop-color="#f7861f"/><stop offset="1" stop-color="#b24d0a"/>
    </radialGradient>
    <linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a4d"/><stop offset="1" stop-color="#070b1a"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a0"/><stop offset="0.35" stop-color="#ffd23f"/><stop offset="0.8" stop-color="#d99a00"/><stop offset="1" stop-color="#a87100"/>
    </linearGradient>
    <radialGradient id="gCoin" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff6c2"/><stop offset="0.45" stop-color="#ffcc33"/><stop offset="1" stop-color="#c98a00"/>
    </radialGradient>
    <radialGradient id="gStudio" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#ffe0a3"/><stop offset="0.4" stop-color="#ffa45c"/><stop offset="0.8" stop-color="#e2566a"/><stop offset="1" stop-color="#7a2f6e"/>
    </radialGradient>
    <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd8a6"/><stop offset="1" stop-color="#f2a873"/>
    </linearGradient>
    <linearGradient id="gWallEve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9a77a"/><stop offset="1" stop-color="#c9775a"/>
    </linearGradient>
    <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9814a"/><stop offset="1" stop-color="#7a4020"/>
    </linearGradient>
    <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2858"/><stop offset="1" stop-color="#110d24"/>
    </linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8743f"/><stop offset="1" stop-color="#7b4520"/>
    </linearGradient>
    <linearGradient id="gTerra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a4482a"/><stop offset="0.35" stop-color="#e07a4f"/><stop offset="1" stop-color="#8e3a20"/>
    </linearGradient>
    <linearGradient id="gBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3b27a"/><stop offset="1" stop-color="#b47a43"/>
    </linearGradient>
    <linearGradient id="gJean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d9be0"/><stop offset="1" stop-color="#2c4f94"/>
    </linearGradient>
    <linearGradient id="gSun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.85"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gMonitor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d9a"/><stop offset="0.5" stop-color="#ffb800"/><stop offset="1" stop-color="#21e0a0"/>
    </linearGradient>
    <linearGradient id="gPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="gNumber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/><stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <radialGradient id="gVignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#1a0a00" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="gWarm" cx="0.25" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffd48a" stop-opacity="0.35"/><stop offset="0.6" stop-color="#ffd48a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gPool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1c4" stop-opacity="0.55"/><stop offset="1" stop-color="#fff1c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a1600" stop-opacity="0.45"/><stop offset="1" stop-color="#3a1600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBulbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7b0" stop-opacity="1"/><stop offset="0.4" stop-color="#ffd84a" stop-opacity="0.6"/><stop offset="1" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#3a1400" flood-opacity="0.28"/>
    </filter>
    <filter id="blur12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="clipBody"><circle r="200"/></clipPath>
    <clipPath id="clipScreen"><rect x="-140" y="-150" width="280" height="178" rx="78"/></clipPath>
  </defs>
  <g id="frame"></g>
</svg>
</div>
<div id="ui"><button id="play">▶ Lecture</button><input id="scrub" type="range" min="0" max="1" step="0.001" value="0"><span id="tc">0.0s</span></div>
<script src="build/timeline.js"></script>
<script>
"use strict";
const TL = window.TIMELINE, E = TL.events, FPS = TL.fps;
const SC = Object.fromEntries(TL.scenes.map(s => [s.id, s]));
const LN = {}; TL.lines.forEach(l => { if (!LN[l.scene]) LN[l.scene] = l; });

// ------------------------------------------------------------ math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, d) => clamp((t - a) / d);
const ez = {
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  el: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -9 * t) * Math.sin((t * 9 - .75) * (2 * Math.PI / 3)) + 1,
};
const L2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const f1 = n => +n.toFixed(1);
const g = (tr, inner, extra = "") => `<g transform="${tr}" ${extra}>${inner}</g>`;
const tf = (x, y, r = 0, s = 1, sy) => `translate(${f1(x)},${f1(y)}) rotate(${f1(r)}) scale(${+s.toFixed(3)},${+(sy ?? s).toFixed(3)})`;
function chunkT(sub, after = 0) { const c = TL.chunks.find(c => c.start >= after - 0.01 && c.text.includes(sub)); return c ? c.start : after; }
function mouthAt(t) { return TL.mouth[Math.min(TL.mouth.length - 1, Math.max(0, Math.floor(t * FPS)))] || 0; }
function blinkAt(t) { const p = (t + 0.7) % 3.3; return p < 0.13 ? Math.sin(p / 0.13 * Math.PI) : 0; }
function speaking(t) { return TL.lines.some(l => t >= l.start && t <= l.end); }

// ------------------------------------------------------------ Bip
const POSE = {
  rest: [[-212, 190], [212, 190]],
  hip: [[-150, 120], [150, 120]],
  up: [[-250, -150], [250, -150]],
  wave: [[-212, 190], [250, -180]],
  cross: [[95, 95], [-95, 115]],
  lap: [[-70, 150], [70, 150]],
  tie: [[-34, 70], [34, 70]],
  camera: [[60, -40], [160, -60]],
  flail: [[-260, 60], [260, 60]],
};
function ik(sx, sy, tx, ty, l1, l2, bend) {
  const dx = tx - sx, dy = ty - sy;
  const d = clamp(Math.hypot(dx, dy), 20, l1 + l2 - 1);
  const a = Math.atan2(dy, dx);
  const off = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const ea = a + bend * off;
  return { ex: sx + l1 * Math.cos(ea), ey: sy + l1 * Math.sin(ea), hx: sx + d * Math.cos(a), hy: sy + d * Math.sin(a) };
}
function arm(side, target, o) {
  const sx = side * 168, sy = 40;
  const k = ik(sx, sy, target[0], target[1], 108, 100, side > 0 ? -1 : 1);
  const hs = (side > 0 ? o.rHand : o.lHand) || 1;
  let s = `<path d="M${f1(sx)} ${sy} L${f1(k.ex)} ${f1(k.ey)} L${f1(k.hx)} ${f1(k.hy)}" fill="none" stroke="#6f7a87" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>`
        + `<path d="M${f1(sx)} ${sy} L${f1(k.ex)} ${f1(k.ey)} L${f1(k.hx)} ${f1(k.hy)}" fill="none" stroke="#d3d9e0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" transform="translate(-3,-4)"/>`
        + `<circle cx="${f1(k.ex)}" cy="${f1(k.ey)}" r="15" fill="url(#gOrangeBall)"/>`;
  const fing = (side > 0 ? o.rFinger : o.lFinger);
  s += g(tf(k.hx, k.hy, 0, hs), (fing ? `<rect x="-10" y="-58" width="20" height="40" rx="10" fill="url(#gOrangeBall)"/>` : "")
        + `<circle r="31" fill="url(#gOrangeBall)"/><ellipse cx="-9" cy="-11" rx="10" ry="7" fill="#fff" opacity=".45"/>`);
  const item = side > 0 ? o.rItem : o.lItem;
  if (item) s += item(k.hx, k.hy);
  return s;
}
function eyes(o) {
  const e = o.eyes || "normal", gl = o.glow ?? 1, lx = (o.look?.[0] || 0) * 16, ly = (o.look?.[1] || 0) * 12;
  const col = gl > 0.05 ? "#63e6ff" : "#1b2b4a";
  const bl = o.blink || 0;
  const one = (cx, side) => {
    const x = cx + lx, y = -64 + ly;
    let kind = e;
    if (e === "wink" && side > 0) kind = "happy";
    if (e === "squint" && side < 0) kind = "closed";
    if (kind === "happy") return `<path d="M${x - 32} ${y + 14} Q${x} ${y - 38} ${x + 32} ${y + 14}" fill="none" stroke="${col}" stroke-width="17" stroke-linecap="round"/>`;
    if (kind === "closed") return `<path d="M${x - 30} ${y} L${x + 30} ${y}" stroke="${col}" stroke-width="15" stroke-linecap="round"/>`;
    if (kind === "money") return `<text x="${x}" y="${y + 28}" text-anchor="middle" font-size="96" fill="#ffe14d">€</text>`;
    const big = kind === "wide" ? 1.2 : 1;
    const ry = 46 * big * (1 - 0.92 * bl);
    let s = `<ellipse cx="${x}" cy="${y}" rx="${34 * big}" ry="${f1(Math.max(4, ry))}" fill="${col}"/>`;
    if (gl > 0.05 && bl < 0.5) s += `<ellipse cx="${x - 10}" cy="${y - 16}" rx="9" ry="12" fill="#fff" opacity="${0.9 * gl}"/><circle cx="${x + 12}" cy="${y + 14}" r="5" fill="#fff" opacity="${0.6 * gl}"/>`;
    if (kind === "sad") s += `<path d="M${x - 50} ${y - 60} L${x + 50} ${y - 60} L${x + 50} ${y - 50 + (side < 0 ? -10 : 30)} L${x - 50} ${y - 50 + (side < 0 ? 30 : -10)} Z" fill="url(#gScreen)"/>`;
    if (kind === "angry") s += `<path d="M${x - 50} ${y - 60} L${x + 50} ${y - 60} L${x + 50} ${y - 6 + (side < 0 ? 18 : -14)} L${x - 50} ${y - 6 + (side < 0 ? -14 : 18)} Z" fill="url(#gScreen)"/>`;
    if (kind === "flat") s += `<rect x="${x - 50}" y="${y - 70}" width="100" height="62" fill="url(#gScreen)"/>`;
    return s;
  };
  let mouth = "";
  const m = o.mouth || 0, mx = lx * 0.6, my = 2 + ly * 0.5;
  if (m > 0.08) mouth = `<rect x="${f1(mx - 26 - m * 8)}" y="${f1(my - 4 - m * 12)}" width="${f1(52 + m * 16)}" height="${f1(8 + m * 26)}" rx="${f1(4 + m * 13)}" fill="${col}"/>`;
  else if ((o.smile ?? 1) > 0.5) mouth = `<path d="M${mx - 24} ${my - 4} Q${mx} ${my + 16} ${mx + 24} ${my - 4}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"/>`;
  else if (o.smile < -0.5) mouth = `<path d="M${mx - 22} ${my + 8} Q${mx} ${my - 10} ${mx + 22} ${my + 8}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"/>`;
  else mouth = `<rect x="${mx - 20}" y="${my - 3}" width="40" height="8" rx="4" fill="${col}"/>`;
  return `<g clip-path="url(#clipScreen)"><g ${gl > 0.05 ? 'filter="url(#glow)"' : ""} opacity="${0.35 + 0.65 * gl}">${one(-58, -1)}${one(58, 1)}${mouth}</g></g>`;
}
function tieShape() {
  return `<path d="M-15 76 L15 76 L52 286 L0 336 L-52 286 Z" fill="url(#gGold)" stroke="#a87100" stroke-width="3"/>`
    + `<path d="M-6 120 L22 108 M-22 170 L36 146 M-34 222 L46 190 M-46 272 L50 238" stroke="#c98600" stroke-width="10" opacity=".55"/>`
    + `<path d="M-27 34 L27 34 L19 80 L-19 80 Z" fill="url(#gGold)" stroke="#a87100" stroke-width="3"/>`
    + `<path d="M-14 42 L-6 74" stroke="#fff6c0" stroke-width="5" opacity=".7"/>`;
}
function bip(o) {
  const t = o.t || 0;
  const pose = o.pose || "rest";
  const tg = o.arms || POSE[pose];
  const L = tg[0], R = tg[1];
  const front = o.front || {};
  const bob = o.noBob ? 0 : Math.sin(t * 5.2) * 5;
  let s = "";
  // legs
  if (!o.sit) {
    s += `<rect x="-104" y="150" width="38" height="78" rx="14" fill="#7d8794"/><rect x="66" y="150" width="38" height="78" rx="14" fill="#7d8794"/>`
       + `<ellipse cx="-92" cy="236" rx="56" ry="27" fill="url(#gOrangeBall)"/><ellipse cx="92" cy="236" rx="56" ry="27" fill="url(#gOrangeBall)"/>`;
  } else {
    s += `<ellipse cx="-108" cy="178" rx="58" ry="40" fill="url(#gOrangeBall)"/><ellipse cx="108" cy="178" rx="58" ry="40" fill="url(#gOrangeBall)"/>`;
  }
  let body = "";
  if (!front.l) body += arm(-1, L, o);
  if (!front.r) body += arm(1, R, o);
  // antenna
  const ant = o.ant ?? 0.2, ar = o.antRot || 0;
  let antS = `<path d="M0 -196 Q 6 -232 0 -262" stroke="#7d8794" stroke-width="11" fill="none" stroke-linecap="round"/>`;
  if (ant > 0.35) antS += `<circle cx="0" cy="-282" r="${f1(40 + ant * 90)}" fill="url(#gBulbGlow)" opacity="${ant}"/>`;
  if (ant > 0.7) for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + t * 0.8; antS += `<path d="M${f1(Math.cos(a) * 44)} ${f1(-282 + Math.sin(a) * 44)} L${f1(Math.cos(a) * (66 + ant * 40))} ${f1(-282 + Math.sin(a) * (66 + ant * 40))}" stroke="#ffe066" stroke-width="9" stroke-linecap="round" opacity="${f1((ant - 0.7) * 3.3)}"/>`; }
  antS += `<circle cx="0" cy="-282" r="22" fill="${ant > 0.5 ? "#fff59a" : "url(#gOrangeBall)"}" ${ant > 0.5 ? 'filter="url(#glow)"' : ""}/><ellipse cx="-7" cy="-290" rx="7" ry="5" fill="#fff" opacity=".7"/>`;
  body += g(`rotate(${f1(ar)} 0 -196)`, antS);
  // ears
  body += `<circle cx="-198" cy="-48" r="32" fill="url(#gOrangeBall)"/><circle cx="198" cy="-48" r="32" fill="url(#gOrangeBall)"/><circle cx="-204" cy="-48" r="12" fill="#8a3f08" opacity=".5"/><circle cx="204" cy="-48" r="12" fill="#8a3f08" opacity=".5"/>`;
  // body sphere
  body += `<circle r="200" fill="url(#gSilver)"/>`
    + `<g clip-path="url(#clipBody)"><rect x="-210" y="112" width="420" height="120" fill="url(#gOrange)"/><path d="M-210 112 L210 112" stroke="#5c6672" stroke-width="6" opacity=".5"/>`
    + `<circle cx="-120" cy="150" r="7" fill="#8a3f08" opacity=".6"/><circle cx="120" cy="150" r="7" fill="#8a3f08" opacity=".6"/>`
    + `<circle r="200" fill="none" stroke="#3d4650" stroke-width="40" opacity=".18"/></g>`
    + `<ellipse cx="-92" cy="-138" rx="58" ry="34" fill="#fff" opacity=".75" transform="rotate(-30 -92 -138)" filter="url(#blur12)"/>`;
  // screen
  body += `<rect x="-148" y="-158" width="296" height="194" rx="86" fill="#5c6672"/><rect x="-140" y="-150" width="280" height="178" rx="78" fill="url(#gScreen)"/>`;
  body += eyes(o);
  body += `<path d="M-110 -128 Q-60 -150 10 -146" stroke="#fff" stroke-width="8" fill="none" opacity=".18" stroke-linecap="round"/>`;
  // tie
  if (o.tie !== false) body += g(`rotate(${f1(o.tieRot || 0)} 0 34)`, tieShape());
  if (front.l) body += arm(-1, L, o);
  if (front.r) body += arm(1, R, o);
  s += body;
  const sq = o.squash || 0;
  return g(tf(o.x, o.y + bob * (o.s || 1), o.rot || 0, (o.s || 1) * (o.flip ? -1 : 1) * (1 + sq * 0.12), (o.s || 1) * (1 - sq * 0.12)), s);
}
function shadow(x, y, w, a = 1) { return `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(w)}" ry="${f1(w * 0.18)}" fill="url(#gShadow)" opacity="${a}"/>`; }

// ------------------------------------------------------------ backgrounds
function bgStudio(t) {
  let s = `<rect width="1080" height="1920" fill="url(#gStudio)"/>`;
  const r = rng(5);
  for (let i = 0; i < 16; i++) {
    const x = r() * 1080, y = r() * 1920, rad = 30 + r() * 90, sp = 6 + r() * 14;
    s += `<circle cx="${f1((x + t * sp) % 1180 - 50)}" cy="${f1(y - Math.sin(t * .5 + i) * 30)}" r="${f1(rad)}" fill="#fff" opacity="${f1(0.06 + r() * 0.1)}" filter="url(#blur12)"/>`;
  }
  s += `<ellipse cx="540" cy="1290" rx="520" ry="110" fill="#fff4d6" opacity=".25" filter="url(#blur30)"/>`;
  return s;
}
function bgRoom(opt = {}) {
  const wall = opt.eve ? "url(#gWallEve)" : "url(#gWall)";
  let s = `<rect width="1080" height="1260" fill="${wall}"/>`;
  for (let x = 40; x < 1080; x += 90) s += `<rect x="${x}" y="0" width="34" height="1240" fill="#fff" opacity=".07"/>`;
  s += `<rect y="1222" width="1080" height="34" fill="#f6e6d0"/><rect y="1252" width="1080" height="668" fill="url(#gFloor)"/>`;
  for (let i = 0; i < 9; i++) { const y = 1252 + Math.pow(i / 9, 1.6) * 668; s += `<path d="M0 ${f1(y)} L1080 ${f1(y)}" stroke="#5e2f14" stroke-width="3" opacity=".35"/>`; }
  for (let i = -6; i <= 6; i++) s += `<path d="M${540 + i * 40} 1252 L${540 + i * 260} 1920" stroke="#5e2f14" stroke-width="2" opacity=".2"/>`;
  if (opt.frame !== false) {
    s += `<g filter="url(#soft)"><rect x="${opt.frameX ?? 90}" y="300" width="200" height="250" rx="10" fill="#7a4a2a"/><rect x="${(opt.frameX ?? 90) + 16}" y="316" width="168" height="218" fill="#9fd4ff"/>`

      `<rect x="-300" y="-72" width="600" height="144" rx="72" fill="${done ? "#5c6672" : "#ff2d55"}" filter="url(#soft)"/>`
      + `<text x="${done ? 0 : 30}" y="22" text-anchor="middle" font-size="64" fill="#fff">${done ? "ABONNÉ ✓" : "ABONNE-TOI"}</text>`
      + (done ? "" : g(tf(-215, 0, Math.sin(t * 12) * 14), `<path d="M-28 18 Q-28 -30 0 -32 Q28 -30 28 18 L36 26 L-36 26 Z" fill="#fff"/><circle cy="34" r="9" fill="#fff"/>`)));
    if (t > E.final_click - 0.45) { const k = P(t, E.final_click - 0.45, 0.45); ui += g(tf(lerp(900, 600, ez.out(k)), lerp(1980, 1820, ez.out(k)), -20, done ? 0.9 : 1), `<path d="M0 0 L0 -70 Q0 -84 14 -84 Q28 -84 28 -70 L28 -30 L70 -22 Q86 -18 84 0 L76 50 L10 50 Z" fill="#fff" stroke="#222" stroke-width="6" stroke-linejoin="round"/>`); }
    ui += confetti(540, 1790, t, E.final_click + 0.05, 50, 8);
    return { world: camWrap(w, 540, lerp(900, 940, P(lt, 0, 4)), lerp(1.5, 1.3, ez.io(P(lt, 0, 1.2))) * punch(lt)), ui };
  },
};

// ------------------------------------------------------------ subtitles
function subtitle(t) {
  const c = TL.chunks.find(c => t >= c.start && t < c.end);
  if (!c) return "";
  const plain = c.text.replace(/\*/g, "");
  const fs = plain.length > 15 ? 84 : plain.length > 11 ? 96 : 108;
  const k = P(t, c.start, 0.12);
  const s = 1 + 0.16 * (1 - ez.out(k));
  const words = c.text.split(" ").map(w => {
    const kw = /^\*.*\*[,.!?:…]*$/.test(w) || /^\*.*\*$/.test(w);
    const txt = w.replace(/\*/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
    return `<tspan fill="${kw ? "#ffe14d" : "#fff"}">${txt}</tspan>`;
  }).join(" ");
  return g(tf(540, 1580, 0, s), `<text text-anchor="middle" font-size="${fs}" fill="#fff" stroke="#000" stroke-width="${fs * 0.17}" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">${words}</text>`);
}

// ------------------------------------------------------------ render
const frameEl = document.getElementById("frame");
function render(t) {
  t = clamp(t, 0, TL.duration - 1e-3);
  const S = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  const r = SCENES[S.id](t, t - S.start, S);
  let out = r.world;
  out += `<rect width="1080" height="1920" fill="url(#gWarm)"/><rect width="1080" height="1920" fill="url(#gVignette)"/>`;
  out += r.ui || "";
  out += subtitle(t);
  // micro-transition : léger fondu au blanc chaud sur chaque coupe
  const cut = t - S.start;
  if (S.start > 0 && cut < 0.08) out += `<rect width="1080" height="1920" fill="#fff4dc" opacity="${f1((1 - cut / 0.08) * 35) / 100}"/>`;
  frameEl.innerHTML = out;
}
window.render = render;
window.DURATION = TL.duration;

// ------------------------------------------------------------ preview player
const params = new URLSearchParams(location.search);
if (params.has("render")) { document.body.classList.add("render"); }
else {
  const audio = new Audio("build/audio.wav");
  const btn = document.getElementById("play"), scrub = document.getElementById("scrub"), tc = document.getElementById("tc");
  scrub.max = TL.duration;
  btn.onclick = () => { if (audio.paused) { audio.play(); btn.textContent = "❚❚ Pause"; } else { audio.pause(); btn.textContent = "▶ Lecture"; } };
  scrub.oninput = () => { audio.currentTime = +scrub.value; };
  audio.onended = () => { btn.textContent = "▶ Lecture"; };
  const loop = () => { const t = audio.currentTime; render(t); scrub.value = t; tc.textContent = t.toFixed(1) + "s"; requestAnimationFrame(loop); };
  document.fonts.load('800 50px "Baloo 2"').then(loop);
}
</script>
